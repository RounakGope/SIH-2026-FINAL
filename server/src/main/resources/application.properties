spring.application.name=fasalrakshak-api
server.port=${PORT:8080}

# Database: embedded H2 for development (no install needed); PostgreSQL + PostGIS
# in docker-compose (DB_URL=jdbc:postgresql://db:5432/fasalrakshak).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fasalrakshak;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Security. JWT_SECRET must be set (32+ characters) anywhere real.
app.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-000}
app.cors=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8081}
app.staff.password=${STAFF_DEMO_PASSWORD:fasalrakshak-demo}

# Integrations: each is off until its variable is set.
app.inference-url=${INFERENCE_URL:}
app.sms.webhook-url=${SMS_WEBHOOK_URL:}
app.bhashini.user-id=${BHASHINI_USER_ID:}
app.bhashini.api-key=${BHASHINI_API_KEY:}
# The /ivr page stands in for a telephony provider while this is true.
app.ivr.simulator=${IVR_SIMULATOR:true}
app.ivr.key=${IVR_KEY:}
app.officer-contact=${OFFICER_CONTACT:District Agriculture Officer, Wardha}
app.automation-interval-ms=${AUTOMATION_INTERVAL_MS:300000}

# Scan photos travel inside JSON (a sync batch can carry several).
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
